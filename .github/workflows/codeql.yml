name: "CodeQL Security Scan"

on:
  push:
    branches: [ main, dev ]
  schedule:
    - cron: '0 5 * * 1'  # Weekly Monday 5 AM UTC

jobs:
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Get submodule hash
        id: submod
        run: echo "hash=$(git submodule status lib/MeshCore | awk '{print $1}')" >> $GITHUB_OUTPUT

      - name: Cache PlatformIO
        uses: actions/cache@v5
        with:
          path: |
            ~/.platformio
            .pio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}-${{ steps.submod.outputs.hash }}
          # No restore-keys: falling back to a cache without the submodule hash
          # restores stale .o files after a submodule bump, causing build failures.

      - name: Install PlatformIO
        run: pip install platformio

      - name: Install dependencies
        run: pio pkg install -e t-deck

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: cpp
          queries: security-extended

      - name: Build for CodeQL
        run: pio run -e t-deck

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:cpp"