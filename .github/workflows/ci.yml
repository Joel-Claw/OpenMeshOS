name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [t-deck, t-deck-plus, heltec-v3, rak-wisblock]
        include:
          - environment: rak-wisblock
            continue-on-error: true
          - environment: t-deck
            continue-on-error: false
          - environment: t-deck-plus
            continue-on-error: false
          - environment: heltec-v3
            continue-on-error: false

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Get submodule hash
        id: submod
        run: echo "hash=$(git submodule status lib/MeshCore | awk '{print $1}')" >> $GITHUB_OUTPUT

      - name: Cache PlatformIO
        uses: actions/cache@v5
        with:
          path: |
            ~/.platformio
            .pio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}-${{ steps.submod.outputs.hash }}
          restore-keys: |
            pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}-
            pio-${{ runner.os }}-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Install dependencies
        run: pio pkg install -e ${{ matrix.environment }}
        continue-on-error: ${{ matrix.continue-on-error }}

      - name: Build firmware
        run: pio run -e ${{ matrix.environment }}
        continue-on-error: ${{ matrix.continue-on-error }}

      - name: Set flash size from environment
        id: flash
        if: success() || matrix.continue-on-error
        run: |
          case "${{ matrix.environment }}" in
            heltec-v3)
              echo "size=8MB" >> $GITHUB_OUTPUT
              echo "bytes=8388608" >> $GITHUB_OUTPUT
              echo "platform=esp32" >> $GITHUB_OUTPUT
              ;;
            rak-wisblock)
              echo "size=1MB" >> $GITHUB_OUTPUT
              echo "bytes=1048576" >> $GITHUB_OUTPUT
              echo "platform=nrf52" >> $GITHUB_OUTPUT
              ;;
            *)
              echo "size=16MB" >> $GITHUB_OUTPUT
              echo "bytes=16777216" >> $GITHUB_OUTPUT
              echo "platform=esp32" >> $GITHUB_OUTPUT
              ;;
          esac

      - name: Check firmware size
        if: success() || matrix.continue-on-error
        continue-on-error: ${{ matrix.continue-on-error }}
        run: |
          BUILD=".pio/build/${{ matrix.environment }}"
          FIRMWARE="$BUILD/firmware.bin"
          if [ -f "$FIRMWARE" ]; then
            SIZE=$(wc -c < "$FIRMWARE")
            echo "Firmware size: $SIZE bytes"
            LIMIT=$((${{ steps.flash.outputs.bytes }} * 80 / 100))
            if [ "$SIZE" -gt "$LIMIT" ]; then
              echo "::warning::Firmware size ($SIZE bytes) exceeds 80% of flash"
            fi
          else
            echo "::warning::Firmware binary not found (WIP platform)"
            exit 1
          fi

      - name: Build merged binary (ESP32 only)
        if: (success() || matrix.continue-on-error) && steps.flash.outputs.platform == 'esp32'
        continue-on-error: ${{ matrix.continue-on-error }}
        run: |
          BUILD=".pio/build/${{ matrix.environment }}"
          pip install esptool
          esptool.py --chip esp32s3 merge_bin \
            -o "$BUILD/openmeshos-merged.bin" \
            --flash_mode dio \
            --flash_size ${{ steps.flash.outputs.size }} \
            0x0 "$BUILD/bootloader.bin" \
            0x8000 "$BUILD/partitions.bin" \
            0x10000 "$BUILD/firmware.bin"
          echo "Merged binary size: $(wc -c < "$BUILD/openmeshos-merged.bin") bytes"

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v5
        with:
          name: firmware-${{ matrix.environment }}
          path: |
            .pio/build/${{ matrix.environment }}/firmware.bin
            .pio/build/${{ matrix.environment }}/openmeshos-merged.bin
          if-no-files-found: ignore

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check for TODOs in code
        run: |
          grep -rn "TODO\|FIXME\|HACK\|XXX" src/ || true

      - name: Check license headers
        run: |
          MISSING=0
          for f in $(find src/ -name '*.cpp' -o -name '*.h'); do
            if ! head -3 "$f" | grep -qi "WTFPL\|public license\|Joel Claw"; then
              echo "Missing license header: $f"
              MISSING=1
            fi
          done
          if [ "$MISSING" -eq 1 ]; then
            echo "::warning::Some files are missing WTFPL license headers"
          fi

      - name: Check docs exist for all screens
        run: |
          for screen in ScreenHome ScreenMap ScreenSettings ScreenTerminal; do
            if [ ! -f "docs/UI_DESIGN.md" ]; then
              echo "::error::Missing UI_DESIGN.md"
              exit 1
            fi
            if ! grep -q "$screen" docs/UI_DESIGN.md; then
              echo "::warning::$screen not documented in UI_DESIGN.md"
            fi
          done

      - name: Check version.h matches
        run: |
          if [ ! -f "src/version.h" ]; then
            echo "::error::Missing src/version.h"
            exit 1
          fi
          echo "Version: $(grep OMS_VERSION_STRING src/version.h)"

  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install tile script dependencies
        run: pip install requests

      - name: Test tile download script loads
        run: |
          python3 -c "import importlib.util; spec = importlib.util.spec_from_file_location('download_tiles', 'scripts/download_tiles.py'); mod = importlib.util.module_from_spec(spec); spec.loader.exec_module(mod); print('Module loads OK')"

      - name: Test tile download script --help
        run: python3 scripts/download_tiles.py --help

  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install g++ (C++14)
        run: |
          sudo apt-get update
          sudo apt-get install -y g++

      - name: Run all host-side unit tests
        run: |
          chmod +x scripts/run_tests.sh
          bash scripts/run_tests.sh

      - name: Verify MapEngine tests independently
        run: |
          g++ -std=c++14 -Wall -Wextra -Isrc -o test_map_engine test/test_map_engine.cpp -lm
          ./test_map_engine