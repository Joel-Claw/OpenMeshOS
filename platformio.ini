; OpenMeshOS — open-source standalone firmware for LoRa mesh devices
; Copyright 2026 Joel Claw & contributors — WTFPL v2
;
; Platform:  ESP32-S3 (T-Deck / T-Deck Plus)
; Framework: Arduino
; Display:   ST7789 320x240 IPS
; LoRa:      SX1262
; Build:     pio run -e t-deck

[platformio]
boards_dir = boards

[env:t-deck]
platform  = espressif32
board     = esp32-s3-devkitm-1
framework = arduino

; ── Flash & partition layout ──────────────────────────────────────────
board_build.flash_size    = 16MB
board_build.flash_mode    = dio
board_build.partitions    = partitions.csv
board_upload.flash_size   = 16MB
board_upload.maximum_size = 16777216

; ── CPU & PSRAM ──────────────────────────────────────────────────────
board_build.f_cpu       = 240000000L
board_build.arduino.memory_type = qio_opi
build_flags =
  -DARDUINO_ESP32S3_DEV
  -DBOARD_HAS_PSRAM=1
  -DPSRAM=opi
  -DPSRAM_MODE=octal
  -DPSRAM_SIZE=8388608
  -DCONFIG_SPIRAM_USE_MALLOC=1
  -DCONFIG_ESP32S3_SPIRAM_SUPPORT=1

; ── OpenMeshOS build flags ───────────────────────────────────────────
  -DOMS_VERSION="0.1.0-alpha.2"
  -DOMS_PLATFORM_TDECK=1
  -DOMS_SCREEN_W=320
  -DOMS_SCREEN_H=240

; ── MeshCore integration ────────────────────────────────────────────
; MeshCore lives in lib/MeshCore as a git submodule
  -DMESH_DEBUG=0
  -DRADIOLIB_GODMODE=1
  -DRADIOLIB_STATIC_ONLY=1

; ── LoRa radio (SX1262 on T-Deck) ────────────────────────────────────
  -DUSING_SX1262=1

; ── Display driver (ST7789 via SPI) ─────────────────────────────────
  -DUSER_SETUP_LOADED=1
  -DST7789_DRIVER=1
  -DOMS_TFT_WIDTH=320
  -DOMS_TFT_HEIGHT=240
  -DCGRAM_OFFSET=1
  -DTFT_WIDTH=320
  -DTFT_HEIGHT=240
  -DTFT_CS=12
  -DTFT_DC=11
  -DTFT_RST=-1
  -DTFT_MOSI=41
  -DTFT_SCLK=40
  -DTFT_BL=42
  -DSPI_FREQUENCY=40000000
  -DLOAD_GLCD=1
  -DLOAD_FONT2=1
  -DLOAD_GFXFF=1

; ── GPS (T-Deck Plus has built-in GPS, OG uses external) ─────────────
;  -DOMS_HAS_BUILTIN_GPS=1

; ── Debug serial ────────────────────────────────────────────────────
  -DCORE_DEBUG_LEVEL=1
  -DBOARD_HAS_USB_SERIAL=1

; ── LVGL config ─────────────────────────────────────────────────────
  -DLV_CONF_INCLUDE_SIMPLE
  -I lib
  -I lib/MeshCore/lib/ed25519

; ── Optimisation: size matters on embedded ──────────────────────────
  -Os
  -ffunction-sections
  -fdata-sections
  -Wl,--gc-sections

; ── Pre-build script (remove Helium ARM assembly) ─────────────────────
extra_scripts = pre:pre_build.py

; ── Monitor ─────────────────────────────────────────────────────────
monitor_speed = 115200
monitor_filters = direct

; ── Lib deps (managed via PlatformIO registry) ─────────────────────
lib_deps =
  bodmer/TFT_eSPI@^2.5.34
  lvgl/lvgl@^9.2
  adafruit/Adafruit BusIO@^1.16
  adafruit/RTClib@^2.1
  jgromes/RadioLib@^7.6.0
  rweather/Crypto@^0.4.0
  mikalhart/TinyGPSPlus@^1.0.3

; ── LDF must resolve deep deps (ed25519 from MeshCore) ─────────────────
lib_ldf_mode = deep+
lib_archive = no

; ── Extra sources: ed25519 crypto (needed by MeshCore Identity) ─────────
; PlatformIO LDF can't discover this from MeshCore's nested lib, so it's copied to src/crypto/
lib_extra_dirs = lib/MeshCore/lib

lib_ignore =
  lvgl/src/draw/sw/blend/helium
  lvgl/src/draw/arm2d
  lvgl/src/draw/nema_gfx
  lvgl/src/draw/nxp
  lvgl/src/draw/renesas
  lvgl/src/draw/sdl
  lvgl/src/draw/vg_lite_tvg
  lvgl/src/draw/dma2d
  lvgl/src/draw/eve
  lvgl/src/draw/nanovg
  lvgl/src/draw/opengles
  lvgl/src/draw/espressif

; ── Lib dirs ────────────────────────────────────────────────────────
; lib_dir is default (lib/)
; MeshCore submodule picked up automatically from lib/MeshCore
; ed25519 is a dependency inside MeshCore/lib that needs explicit inclusion

; ── Source filter: exclude headless-only stubs ────────────────────────
build_src_filter =
  +<*>
  -<hardware/NotificationStub.cpp>
  -<hardware/BoardHeltecV3.cpp>
  -<hardware/BoardRAK4631.cpp>
  -<hardware/DisplaySSD1306.cpp>

; ── Upload ─────────────────────────────────────────────────────────
upload_speed = 921600
upload_port  =

; ══════════════════════════════════════════════════════════════════════
; T-Deck Plus (same as t-deck but with built-in GPS)
; ══════════════════════════════════════════════════════════════════════
[env:t-deck-plus]
extends = env:t-deck
build_flags =
  ${env:t-deck.build_flags}
  -DOMS_HAS_BUILTIN_GPS=1

; ══════════════════════════════════════════════════════════════════════
; Heltec WiFi LoRa 32 V3 (WORK IN PROGRESS)
; ESP32-S3FN8 + SX1262 + SSD1306 OLED (128x64, I2C)
; No keyboard, no trackball, no GPS, no SD card, no speaker.
; Best suited for repeater nodes, BLE companion mode, or sensor nodes.
;
; STATUS: Board support complete. MeshService uses IBoard::loraConfig()
; for LoRa pin config (no longer hardcoded to T-Deck pins).
; MeshBoard/MeshClock are platform-agnostic (delegate to IBoard).
; Remaining: test on hardware, verify OLED display + BLE companion.
; ══════════════════════════════════════════════════════════════════════
[env:heltec-v3]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = arduino

; ── Flash & partition layout ──────────────────────────────────────────
board_build.flash_size    = 8MB
board_build.flash_mode    = dio
board_build.partitions    = partitions.csv
board_upload.flash_size   = 8MB
board_upload.maximum_size = 8388608

; ── CPU (no PSRAM on Heltec V3) ──────────────────────────────────────
board_build.f_cpu = 240000000L
build_flags =
  -DARDUINO_ESP32S3_DEV

; ── OpenMeshOS build flags ───────────────────────────────────────────
  -DOMS_VERSION="0.1.0-alpha.2"
  -DOMS_PLATFORM_HELTEC_V3=1
  -DOMS_SCREEN_W=128
  -DOMS_SCREEN_H=64

; ── MeshCore integration ────────────────────────────────────────────
  -DMESH_DEBUG=0
  -DRADIOLIB_GODMODE=1
  -DRADIOLIB_STATIC_ONLY=1

; ── LoRa radio (SX1262 on Heltec V3) ────────────────────────────────
  -DUSING_SX1262=1

; ── SX1262 specific: DIO2 as RF switch, DIO3 as TCXO ────────────────
; Heltec V3 uses DIO2 to control the RF switch (internal or external)
; and DIO3 to supply TCXO voltage (1.8V). This differs from T-Deck
; which does not use these features.
  -DSX126X_DIO2_AS_RF_SWITCH=true
  -DSX126X_DIO3_TCXO_VOLTAGE=1.8
  -DSX126X_CURRENT_LIMIT=140
  -DSX126X_RX_BOOSTED_GAIN=1

; ── Display driver (SSD1306 OLED via I2C, NOT TFT_eSPI) ─────────────
; The Heltec V3 uses a 0.96" SSD1306 OLED, not an SPI TFT.
; We define these for compatibility but the display driver will use
; the Adafruit SSD1306 library instead of TFT_eSPI.
  -DOMS_DISPLAY_SSD1306=1
  -DOMS_DISPLAY_I2C=1

; ── Debug serial ────────────────────────────────────────────────────
  -DCORE_DEBUG_LEVEL=1
  -DBOARD_HAS_USB_SERIAL=1

; ── LVGL config ─────────────────────────────────────────────────────
  -DLV_CONF_INCLUDE_SIMPLE
  -I lib
  -I lib/MeshCore/lib/ed25519

; ── Optimisation ─────────────────────────────────────────────────────
  -Os
  -ffunction-sections
  -fdata-sections
  -Wl,--gc-sections

; ── Pre-build script (remove Helium ARM assembly) ─────────────────────
extra_scripts = pre:pre_build.py

; ── Monitor ─────────────────────────────────────────────────────────
monitor_speed = 115200
monitor_filters = direct

; ── Source filters ──────────────────────────────────────────────────
; Exclude T-Deck-only sources (keyboard, trackball, TFT UI, SD card).
; MeshService uses IBoard::loraConfig() for LoRa pins (platform-agnostic).
build_src_filter =
  +<*>
  -<hardware/KeyboardInput.cpp>
  -<hardware/Keyboard.cpp>
  -<hardware/Trackball.cpp>
  -<hardware/SDCard.cpp>
  -<hardware/Notification.cpp>
  +<hardware/NotificationStub.cpp>
  -<ui/*>
  -<map/*>
  -<mesh/BLECompanionNRF52.cpp>

; ── Lib deps ────────────────────────────────────────────────────────
; Note: No TFT_eSPI for Heltec V3 (uses SSD1306 OLED instead).
; No TinyGPSPlus (no built-in GPS).
lib_deps =
  adafruit/Adafruit SSD1306@^2.5
  adafruit/Adafruit BusIO@^1.16
  adafruit/RTClib@^2.1
  jgromes/RadioLib@^7.6.0
  rweather/Crypto@^0.4.0

; ── LDF and lib config ──────────────────────────────────────────────
lib_ldf_mode = deep+
lib_archive = no
lib_extra_dirs = lib/MeshCore/lib

lib_ignore =
  lvgl/src/draw/sw/blend/helium
  lvgl/src/draw/arm2d
  lvgl/src/draw/nema_gfx
  lvgl/src/draw/nxp
  lvgl/src/draw/renesas
  lvgl/src/draw/sdl
  lvgl/src/draw/vg_lite_tvg
  lvgl/src/draw/dma2d
  lvgl/src/draw/eve
  lvgl/src/draw/nanovg
  lvgl/src/draw/opengles
  lvgl/src/draw/espressif

; ── Upload ──────────────────────────────────────────────────────────
upload_speed = 921600
upload_port  = 
; ══════════════════════════════════════════════════════════════════════
; RAK WisBlock RAK4631 (WORK IN PROGRESS)
; nRF52840 MCU + SX1262 LoRa + optional SSD1306 OLED (128x64, I2C)
; No keyboard, no trackball, no GPS (optional external), no SD card, no speaker.
; Best suited for repeater nodes, solar-powered remote nodes, BLE companion.
;
; STATUS: Board support files created (BoardRAK4631, BoardFactory update).
; This is the first non-ESP32 platform — it uses the nRF52 Arduino core
; instead of ESP32 Arduino. Key differences:
;   - No WiFi (nRF52 has BLE only)
;   - No PSRAM (256KB RAM is sufficient for mesh)
;   - Different SPI/ADC/GPIO APIs
;   - Uses Nordic SoftDevice for BLE (different from ESP32 BLE)
;   - Internal flash (1MB) via littlefs, not SPIFFS
; Full firmware build requires adapting Config/MeshService for nRF52.
; ══════════════════════════════════════════════════════════════════════
[env:rak-wisblock]
platform  = nordicnrf52
board     = wiscore_rak4631
framework = arduino
platform_packages =
  platformio/toolchain-gccarmnoneeabi@1.140201.0

; ── Flash & partition layout ──────────────────────────────────────────
board_build.flash_size    = 1MB
board_build.partitions    = partitions_nrf52.csv
board_upload.flash_size   = 1MB

; ── CPU (nRF52840 runs at 64MHz) ────────────────────────────────────
board_build.f_cpu = 64000000L
build_flags =
  -DOMS_VERSION="0.1.0-alpha.2"
  -DOMS_PLATFORM_RAK4631=1
  -DOMS_SCREEN_W=128
  -DOMS_SCREEN_H=64

; ── nRF52 specific ──────────────────────────────────────────────────
  -DARDUINO_ARCH_NRF52840
  -DARDUINO_NRF52840_RAK4631
  -DNRF52_PLATFORM
  -DNRF52_POWER_MANAGEMENT

; ── MeshCore integration ────────────────────────────────────────────
  -DMESH_DEBUG=0
  -DRADIOLIB_GODMODE=1
  -DRADIOLIB_STATIC_ONLY=1
  -I boards
  -include time.h

; ── LoRa radio (SX1262 on RAK4631) ────────────────────────────────
  -DUSING_SX1262=1

; ── SX1262 specific: DIO2 as RF switch, DIO3 as TCXO ────────────────
  -DSX126X_DIO2_AS_RF_SWITCH=true
  -DSX126X_DIO3_TCXO_VOLTAGE=1.8
  -DSX126X_CURRENT_LIMIT=140
  -DSX126X_RX_BOOSTED_GAIN=1

; ── Display driver (SSD1306 OLED via I2C, NOT TFT_eSPI) ─────────────
  -DOMS_DISPLAY_SSD1306=1
  -DOMS_DISPLAY_I2C=1

; ── Debug serial ────────────────────────────────────────────────────
  -DCORE_DEBUG_LEVEL=1

; ── LVGL config ─────────────────────────────────────────────────────
  -DLV_CONF_INCLUDE_SIMPLE
  -I lib
  -I lib/MeshCore/lib/ed25519

; ── Suppress MeshCore warnings on nRF52 (submodule, can't fix) ─────────
  -Wno-error=class-memaccess

; ── Optimisation: size matters on embedded ──────────────────────────
  -Os
  -ffunction-sections
  -fdata-sections
  -Wl,--gc-sections

; ── Pre-build scripts ────────────────────────────────────────────────
extra_scripts =
  pre:pre_build_rak.py
  pre:pre_build.py

; ── Monitor ─────────────────────────────────────────────────────────
monitor_speed = 115200
monitor_filters = direct

; ── Source filters ──────────────────────────────────────────────────
; Exclude T-Deck-only and ESP32-only sources.
; RAK4631 uses nRF52 APIs, not ESP32.
build_src_filter =
  +<*>
  -<hardware/KeyboardInput.cpp>
  -<hardware/Keyboard.cpp>
  -<hardware/Trackball.cpp>
  -<hardware/SDCard.cpp>
  -<hardware/Notification.cpp>
  +<hardware/NotificationStub.cpp>
  -<hardware/BoardTDeck.cpp>
  -<hardware/BoardHeltecV3.cpp>
  -<ui/*>
  -<map/*>
  -<mesh/BLECompanion.cpp>
  +<mesh/BLECompanionFactory.cpp>
  -<utils/ConfigExport.cpp>

; ── Lib deps ────────────────────────────────────────────────────────
; nRF52 does not need TFT_eSPI (uses SSD1306 OLED via I2C).
; No TinyGPSPlus (no built-in GPS).
; No RTClib (nRF52 has built-in RTC).
; Bluefruit52Lib is bundled with the Adafruit nRF52 Arduino core
; (framework-arduinoadafruitnrf52), so no lib_dep is needed for BLE.
lib_deps =
  adafruit/Adafruit SSD1306@^2.5
  adafruit/Adafruit BusIO@^1.16
  jgromes/RadioLib@^7.6.0
  rweather/Crypto@^0.4.0

; ── LDF and lib config ──────────────────────────────────────────────
lib_ldf_mode = deep+
lib_archive = no
lib_extra_dirs = lib/MeshCore/lib

lib_ignore =
  lvgl/src/draw/sw/blend/helium
  lvgl/src/draw/arm2d
  lvgl/src/draw/nema_gfx
  lvgl/src/draw/nxp
  lvgl/src/draw/renesas
  lvgl/src/draw/sdl
  lvgl/src/draw/vg_lite_tvg
  lvgl/src/draw/dma2d
  lvgl/src/draw/eve
  lvgl/src/draw/nanovg
  lvgl/src/draw/opengles
  lvgl/src/draw/espressif

; ── Upload ──────────────────────────────────────────────────────────
upload_speed = 115200
upload_port  =
